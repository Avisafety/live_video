###############################################################################
# MediaMTX configuration for Atlas live video (Avisafe)
#
# Flow:
#   Atlas GStreamer --rtmps://<host>:1936/<serial>/<sensor>?token=PUBLISHTOKEN--> (Fly TLS)
#   (<sensor>: 1 = EO, 2 = Thermal. A path without a sensor segment = EO.)
#   (the URL + token come from the atlas-video-endpoint edge function;
#    ?key=APIKEY is still accepted for backwards compatibility)
#                   --rtmp:// (plaintext) --> this server :1935
#   Browser --WHEP (https :443 -> :8889) /<serial>/<sensor>/whep?token=<token>
#           --> WebRTC over TCP :8189
#
# Auth is delegated to the Supabase edge function atlas-video-auth, which is
# called for every publish (validates the Atlas API key) and every read
# (validates a short-lived HMAC token issued by atlas-video-access).
#
# This file must stay identical to what runs on Fly. Deploy manually:
#   cd atlas-video && fly deploy
###############################################################################

logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: https://wazxzyygflomhyoomxcc.functions.supabase.co/atlas-video-auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

rtsp: true
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: :8554
hls: false
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

rtmp: true
rtmpEncryption: "no"
rtmpAddress: :1935

webrtc: true
webrtcAddress: :8889
webrtcEncryption: false
webrtcAllowOrigins:
  - "https://app.avisafe.no"
  - "https://mil.avisafe.no"
  - "https://forsvaret-avisafe.lovable.app"
  - "https://id-preview--fde0152e-cccd-4746-95f2-eb6ab938aaa9.lovable.app"
  - "https://fde0152e-cccd-4746-95f2-eb6ab938aaa9.lovableproject.com"

webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts:
  - 213.188.192.253
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 4s

paths:
  all_others:
    # Wake the object detector. atlas-detector sleeps after 10 minutes without
    # video; a request to its private Flycast address makes Fly start the
    # machine. Sent when a drone starts publishing (runOnReady) and when
    # anyone starts reading (runOnRead: a browser viewer, or the detector
    # itself). Fire-and-forget: a failure only delays the boxes, never video.
    runOnReady: wget -q -T 20 -O /dev/null http://atlas-detector.flycast/wake
    runOnRead: wget -q -T 20 -O /dev/null http://atlas-detector.flycast/wake
